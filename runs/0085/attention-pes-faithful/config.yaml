    \ sequence dimension tile size. Larger tiles = more parallelism but more cache\
    \ pressure.\n- tile_size_n: 32, 64, 128, 256 \u2014 head dimension tile size.\
    \ Match to hardware vector width.\n- vectorization: none, affine, linalg \u2014\
    \ linalg gives best SIMD utilization.\n- unroll_factor: 1, 2, 4, 8 \u2014 higher\
    \ = more ILP but larger code.\n- fusion_strategy: none, producer, consumer, both\
