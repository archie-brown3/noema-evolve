    \ True/False \u2014 GPU shared memory for intermediate tensors.\n- optimize_for_latency:\
    \ True/False \u2014 True for inference, False for throughput.\n- enable_blocking:\
    \ True/False \u2014 block-wise computation like FlashAttention.\n- enable_recomputation:\
    \ True/False \u2014 recompute instead of storing, saves memory.\n\nPublished targets:\
    \ 1.32x speedup (AlphaEvolve level). Above 1.0x is progress. Above 1.15x is good.\
