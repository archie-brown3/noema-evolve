name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        # tests/test_noema_islands_adapter_fidelity_spec.py is a fidelity
        # INSTRUMENT, not a passing suite: it runs OpenEvolve's donor island
        # tests byte-identically through the strict adapter, and 51 of them
        # fail BY DESIGN — each one a declared deviation naming the Noema
        # capability it needs (task 0188 Stage 1's triage ledger). Collecting
        # it here would paint every PR red with expected failures.
        #
        # The deviations stay CI-verified, and more strictly, through
        # TestTriageLedgerParity in tests/test_adapter_instrumentation.py: that
        # test runs the whole donor suite itself and asserts the failing set is
        # EXACTLY those 51, so a deviation that silently starts passing — or a
        # donor that starts failing for a new reason — fails CI.
        run: pytest tests/ -v --tb=short --ignore=tests/test_noema_islands_adapter_fidelity_spec.py
