name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        # tests/test_noema_islands_adapter_fidelity_spec.py runs OpenEvolve's
        # donor island tests byte-identically through the strict adapter. As
        # of Stage 7 all 90 of them pass, so the file is collected here like
        # any other test module.
        #
        # TestTriageLedgerParity in tests/test_adapter_instrumentation.py
        # additionally pins the failing set to empty by running the donor
        # suite itself and asserting no deviations remain, so a regression
        # fails CI even if donor collection were ever broken.
        run: pytest tests/ -v --tb=short
